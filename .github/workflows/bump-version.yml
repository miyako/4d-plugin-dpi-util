# Metadata only: run Build separately on the resulting branch commit.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate, bump and push only selected branch
        env:
          MODE: ${{ inputs.mode }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_REF" == refs/heads/* ]] || { echo "::error::Select a branch"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA" || { echo "::error::Checkout differs from selected SHA"; exit 1; }
          NEW=$(python3 .github/scripts/version.py --bump "$MODE")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DPIUtil.xcodeproj/project.pbxproj Info.plist English.lproj/InfoPlist.strings
          git commit -m "chore: bump version to ${NEW}"
          git -c push.followTags=false push --no-follow-tags origin "HEAD:${SELECTED_REF}"
          echo "### Bumped to v${NEW}. Run Build manually on this branch to build and publish." >> "$GITHUB_STEP_SUMMARY"
